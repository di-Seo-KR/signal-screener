# fly.toml — Zepta Binance Proxy
# 배포: `fly launch --no-deploy`(초기) 후 secrets 설정 → `fly deploy`
#
# 리전: nrt (Tokyo) — 바이낸스는 아시아 리전이 레이턴시 낮음
# 고정 IP: 배포 후 `fly ips allocate-v4` 로 전용 IPv4 할당

app = "zepta-binance-proxy"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
