<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="toitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3182F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#060a12;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#3182F6" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect width="512" height="512" rx="108" fill="none" stroke="#1a2235" stroke-width="1.5"/>
  <!-- Logo mark with glow -->
  <g transform="translate(106, 96)" filter="url(#softGlow)">
    <!-- T vertical stroke -->
    <line x1="80" y1="0" x2="80" y2="320" stroke="url(#toitGrad)" stroke-width="36" stroke-linecap="round"/>
    <!-- T horizontal top -->
    <line x1="0" y1="0" x2="160" y2="0" stroke="url(#toitGrad)" stroke-width="36" stroke-linecap="round"/>
    <!-- i dot -->
    <circle cx="260" cy="0" r="22" fill="url(#toitGrad)"/>
    <!-- i vertical stroke -->
    <line x1="260" y1="64" x2="260" y2="320" stroke="url(#toitGrad)" stroke-width="36" stroke-linecap="round"/>
  </g>
</svg>
